name: AppImage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/appimage.yml'
      - 'package.json'
      - 'bun.lock'
      - 'src/**'
      - 'src-tauri/**'
  push:
    branches:
      - main

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build AppImage bundle
        run: bunx tauri build --bundles appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockit-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
